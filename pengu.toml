[project]
name = "raylib-pengu"
version = "0.1.0"
entry = "pengu/raylib.d.pengu"
output = "c"
output_name = "raylib-pengu"

[build]
src_dir = "pengu"
lib_dir = "lib"
include_dir = "include"
c_dir = "c"
build_dir = "build"
includes = []
# Extra native libraries for this repository's own build (`pengu build` /
# `pengu check`). Consumers get the same set from the `link "..."` statements in
# pengu/raylib.d.pengu; this key only affects this project. `-l` flags do not
# belong in `cflags`.
links = ["raylib", "GL", "dl", "rt", "X11"]
lib_dirs = []
include_dirs = []
cflags = ["-Wall", "-std=c11"]
ldflags = []
defines = []
cc = "gcc"

[assets]
dir = "assets"
module = "arca"
embed = true

[dependencies]

[profiles.debug]
cflags = ["-g", "-O0", "-Wall"]
defines = ["DEBUG"]

[profiles.release]
cflags = ["-O3", "-DNDEBUG", "-ffunction-sections", "-fdata-sections"]
defines = ["NDEBUG"]

[profiles.small]
cflags = ["-Os", "-DNDEBUG", "-ffunction-sections", "-fdata-sections",
          "-fno-asynchronous-unwind-tables", "-fno-unwind-tables",
          "-fno-ident", "-fno-plt"]
defines = ["NDEBUG", "PENGU_SIZE_OPT"]
